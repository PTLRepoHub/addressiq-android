name: Release

# Publishes com.addressiqpro.android:sdk to GitHub Packages + Maven Central.
# Push a tag `vX.Y.Z` (release-please does this), or run manually
# (publishToMavenLocal dry-run).
#
# Secrets:
#   CENTRAL_TOKEN_USERNAME / CENTRAL_TOKEN_PASSWORD  — Central Portal user token
#   SIGNING_KEY / SIGNING_PASSWORD                   — ASCII-armored GPG key
# Each is gated in build.gradle.kts; absent ones are skipped so PR CI stays green.
# GITHUB_TOKEN is automatic (GitHub Packages).
#
# NOTE: the legacy OSSRH hosts were sunset 2025-06-30. We go through the Central
# Portal's OSSRH Staging API, which requires an explicit manual-upload call after
# `gradle publish` — see the "Hand the staged deployment to the Portal" step.

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (publishToMavenLocal)"
        type: boolean
        default: true

permissions:
  contents: write # the demo job attaches APKs to the GitHub release
  packages: write

env:
  # Central Portal namespace — must match `group` in build.gradle.kts.
  CENTRAL_NAMESPACE: com.addressiqpro

jobs:
  publish:
    name: Publish (Maven)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10"

      - name: Bake build config (staging + production)
        env:
          STAGING_ADDRESSIQ_API_BASE_URL: ${{ vars.STAGING_ADDRESSIQ_API_BASE_URL }}
          STAGING_ADDRESSIQ_INGEST_BASE_URL: ${{ vars.STAGING_ADDRESSIQ_INGEST_BASE_URL }}
          STAGING_ADDRESSIQ_CDN_BASE_URL: ${{ vars.STAGING_ADDRESSIQ_CDN_BASE_URL }}
          PROD_ADDRESSIQ_API_BASE_URL: ${{ vars.PROD_ADDRESSIQ_API_BASE_URL }}
          PROD_ADDRESSIQ_INGEST_BASE_URL: ${{ vars.PROD_ADDRESSIQ_INGEST_BASE_URL }}
          PROD_ADDRESSIQ_CDN_BASE_URL: ${{ vars.PROD_ADDRESSIQ_CDN_BASE_URL }}
        run: scripts/bake-build-config.sh --strict

      - name: Publish
        id: publish
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          CENTRAL_TOKEN_USERNAME: ${{ secrets.CENTRAL_TOKEN_USERNAME }}
          CENTRAL_TOKEN_PASSWORD: ${{ secrets.CENTRAL_TOKEN_PASSWORD }}
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        run: |
          set -euo pipefail
          # The per-environment URLs are already baked into the generated source
          # by the step above, so the Gradle invocation carries no URL args.
          if [ "${{ github.event_name }}" = "push" ]; then
            V="${GITHUB_REF_NAME#v}"
            gradle publish -PVERSION="$V" --no-daemon
            echo "staged=true" >> "$GITHUB_OUTPUT"
          else
            gradle publishToMavenLocal -PVERSION="0.0.0-SNAPSHOT" --no-daemon
            echo "staged=false" >> "$GITHUB_OUTPUT"
          fi

      # `gradle publish` uploads to the OSSRH Staging API, but with plain
      # `maven-publish` the deployment is never handed to the Portal until this
      # call is made — and it MUST come from the same IP that uploaded, hence
      # the same job. Skipped when the Central token is absent (the Gradle repo
      # is not wired in that case, so nothing was staged).
      - name: Hand the staged deployment to the Portal
        if: steps.publish.outputs.staged == 'true'
        env:
          CENTRAL_TOKEN_USERNAME: ${{ secrets.CENTRAL_TOKEN_USERNAME }}
          CENTRAL_TOKEN_PASSWORD: ${{ secrets.CENTRAL_TOKEN_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${CENTRAL_TOKEN_USERNAME:-}" ]; then
            echo "::warning::CENTRAL_TOKEN_USERNAME unset — nothing was staged to Maven Central. Skipping."
            exit 0
          fi
          AUTH=$(printf '%s:%s' "$CENTRAL_TOKEN_USERNAME" "$CENTRAL_TOKEN_PASSWORD" | base64 | tr -d '\n')
          # publishing_type=automatic: publish once validation passes, instead
          # of leaving the deployment sitting in the Portal for someone to click.
          # The default is user_managed, which is how three releases in one
          # afternoon ended up queued and none of them live — the workflow
          # reported success at the handoff and the artifacts never reached
          # Central.
          code=$(curl -sS -o /tmp/portal.out -w '%{http_code}' -X POST \
            -H "Authorization: Bearer ${AUTH}" \
            "https://ossrh-staging-api.central.sonatype.com/manual/upload/defaultRepository/${CENTRAL_NAMESPACE}?publishing_type=automatic")
          echo "HTTP $code"; cat /tmp/portal.out || true
          case "$code" in
            2*) echo "Deployment handed to the Portal for automatic publishing." ;;
            *)  echo "::error::manual upload failed (HTTP $code). Artifacts uploaded but NOT published." >&2; exit 1 ;;
          esac

      # Handing over successfully is not the same as being published: validation
      # runs afterwards, and a rejected deployment goes back to waiting. Confirm
      # against Central itself rather than trusting the handoff's 200.
      - name: Confirm the release reached Maven Central
        if: steps.publish.outputs.staged == 'true'
        env:
          CENTRAL_TOKEN_USERNAME: ${{ secrets.CENTRAL_TOKEN_USERNAME }}
        run: |
          set -uo pipefail
          [ -z "${CENTRAL_TOKEN_USERNAME:-}" ] && exit 0
          V="${GITHUB_REF_NAME#v}"
          URL="https://repo1.maven.org/maven2/com/addressiqpro/android/sdk/${V}/"
          # Central sync is minutes, not seconds, and is not worth failing a
          # release over — but silence is what let this go unnoticed, so the
          # outcome always lands in the job summary either way.
          for _ in $(seq 1 30); do
            if [ "$(curl -sS -o /dev/null -w '%{http_code}' "$URL")" = "200" ]; then
              echo "PUBLISHED: $URL"
              echo "✅ \`com.addressiqpro.android:sdk:${V}\` is live on Maven Central." \
                >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep 20
          done
          echo "::warning::${V} is not on Maven Central after 10 minutes."
          {
            echo "⚠️ \`com.addressiqpro.android:sdk:${V}\` did NOT appear on Maven Central"
            echo "within 10 minutes of the handoff."
            echo ""
            echo "Either Central is still syncing, or the deployment failed validation and is"
            echo "waiting at <https://central.sonatype.com/publishing>. Check before assuming"
            echo "the release is out — a green job here does not mean the artifact is available."
          } >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------------
  # Demo app builds. Independent of the Maven publish above — a publish failure
  # must not cost us the downloadable demo, and vice versa.
  #
  # Both example apps are built against the LOCAL SDK (`includeBuild("../..")`)
  # with the release build config baked in, then attached to the GitHub release
  # so partners can download and sideload them straight from the Releases page.
  #
  # These are DEBUG-signed APKs: the example projects carry no release
  # signingConfig, and a `assembleRelease` without one produces an unsigned APK
  # that will not install. Debug signing is what makes the artifact usable.
  # ---------------------------------------------------------------------------
  demo-apk:
    name: "Demo APK · ${{ matrix.lang }}"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        lang: [kotlin, java]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10"

      - name: Bake build config (staging + production)
        env:
          STAGING_ADDRESSIQ_API_BASE_URL: ${{ vars.STAGING_ADDRESSIQ_API_BASE_URL }}
          STAGING_ADDRESSIQ_INGEST_BASE_URL: ${{ vars.STAGING_ADDRESSIQ_INGEST_BASE_URL }}
          STAGING_ADDRESSIQ_CDN_BASE_URL: ${{ vars.STAGING_ADDRESSIQ_CDN_BASE_URL }}
          PROD_ADDRESSIQ_API_BASE_URL: ${{ vars.PROD_ADDRESSIQ_API_BASE_URL }}
          PROD_ADDRESSIQ_INGEST_BASE_URL: ${{ vars.PROD_ADDRESSIQ_INGEST_BASE_URL }}
          PROD_ADDRESSIQ_CDN_BASE_URL: ${{ vars.PROD_ADDRESSIQ_CDN_BASE_URL }}
        run: scripts/bake-build-config.sh --strict

      - name: Assemble
        working-directory: examples/${{ matrix.lang }}
        run: gradle assembleDebug --no-daemon

      - name: Name the artifact after the release
        id: apk
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "push" ]; then V="${GITHUB_REF_NAME#v}"; else V="0.0.0-dev"; fi
          SRC=$(find examples/${{ matrix.lang }} -path '*/outputs/apk/debug/*.apk' | head -1)
          [ -n "$SRC" ] || { echo "::error::no APK produced"; exit 1; }
          OUT="addressiq-android-example-${{ matrix.lang }}-${V}.apk"
          mv "$SRC" "$OUT"
          echo "path=$OUT" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: apk-${{ matrix.lang }}
          path: ${{ steps.apk.outputs.path }}

      # Attach to the release release-please cut for this tag. --clobber so a
      # re-run of the workflow replaces the asset instead of failing.
      - name: Attach to the GitHub release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$GITHUB_REF_NAME" "${{ steps.apk.outputs.path }}" --clobber
